version: 1

# Univers mondial liquide et configurable, pas indice exhaustif. Les titres
# etrangers sont des ADR/actions cotes aux Etats-Unis : prix en USD, CIK SEC et
# formulaires 20-F/40-F exploitables sans fournisseur fondamental payant.
# Tickers, noms, CIK et places de cotation verifies le 2026-08-29 dans le fichier officiel SEC
# https://www.sec.gov/files/company_tickers_exchange.json.
# Les secteurs sont des classifications operationnelles configurees au
# 2026-08-28, non fournies par ce fichier SEC; conserver des snapshots dates
# avant tout futur backtest d'appartenance sectorielle.
# Les capitalisations sont volontairement absentes : elles doivent etre datees et
# sourcees, et ne sont jamais inventees par le scanner.
csv_path: null

filters:
  minimum_market_cap: null
  allowed_countries:
    - United States
    - Canada
    - United Kingdom
    - France
    - Germany
    - Switzerland
    - Netherlands
    - Belgium
    - Denmark
    - Finland
    - Iceland
    - Norway
    - Sweden
    - Spain
    - Italy
    - Australia
    - Japan
    - Hong Kong
    - Singapore
    - South Africa
    - Israel
    - Taiwan
    - China
    - India
    - Brazil
    - Argentina

