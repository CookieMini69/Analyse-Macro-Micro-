project_root: ".."

paths:
  universe: "config/universe.yaml"
  raw_data: "data/raw"
  processed_data: "data/processed"
  cache: "data/cache/prices"
  sec_cache: "data/cache/sec"
  valuation: "config/valuation.yaml"
  macro: "config/macro.yaml"
  macro_exposures: "config/macro_exposures.yaml"
  shock_taxonomy: "config/shock_taxonomy.yaml"
  macro_cache: "data/cache/macro"
  news_cache: "data/cache/news"
  # Validated point-in-time exports from the installed Bigdata.com/Aiera apps.
  external_research: "data/raw/external_research"
  # Immutable lineage for the worldwide v2.0 methodology. Older PEA/global
  # archives remain untouched because membership is immutable by observation date.
  backtest_archive: "data/raw/backtest_global_v2_0_0"
  alerts: "data/processed/alerts"
  alert_state: "data/cache/alerts/state.json"
  reports: "reports"

price:
  provider: "yahoo"
  # Tous les titres passent d'abord par 2 ans de cours en téléchargement groupé.
  # Seuls les candidats techniques chargent ensuite l'historique maximal.
  screening_period: "2y"
  history_period: "max"
  bulk_batch_size: 100
  deep_bulk_batch_size: 250
  cache_ttl_hours: 18
  # Yahoo is an unofficial best-effort source. Conservative concurrency plus
  # the pipeline circuit breaker makes 6k+ title scans safely resumable.
  max_workers: 2
  confidence: 0.80

fundamentals:
  enabled: true
  provider: "sec_edgar"
  user_agent_env: "SEC_USER_AGENT"
  cache_ttl_hours: 24
  requests_per_second: 8.0
  timeout_seconds: 30
  max_retries: 3
  # Parsing runs in parallel; SecEdgarClient still serializes all HTTP calls
  # and enforces requests_per_second globally.
  max_workers: 8
  history_years: 5
  as_of: null
  minimum_score_coverage: 0.50

valuation:
  enabled: true
  historical_minimum_points: 3
  sector_minimum_peers: 3
  minimum_score_coverage: 0.50
  reverse_growth_lower_bound: -0.50
  reverse_growth_upper_bound: 0.50

macro:
  enabled: true
  provider: "mixed_official"
  api_key_env: "FRED_API_KEY"
  cache_ttl_hours: 24
  timeout_seconds: 30
  max_retries: 3
  history_years: 2

fx:
  enabled: true
  provider: frankfurter_ecb
  target_currencies: [USD, EUR]
  cache_ttl_hours: 24
  timeout_seconds: 30
  max_retries: 3

news:
  enabled: true
  provider: "gdelt"
  cache_ttl_hours: 6
  # GDELT is best-effort. A failed candidate must not stall a 6,289-title scan;
  # the result remains explicitly data_unavailable and can be refreshed later.
  timeout_seconds: 6
  max_retries: 0
  lookback_days: 30
  max_articles: 75
  # Bounded parallelism keeps a large global scan practical without
  # overwhelming the public GDELT endpoint.
  max_workers: 4
  # All titles receive the price screen and every price candidate receives the
  # fundamental/valuation pass. Public-news calls are reserved for this
  # auditable preliminary shortlist so a free endpoint remains usable.
  deep_analysis_limit: 250

shock:
  enabled: true
  minimum_independent_sources: 2
  minimum_score_coverage: 0.50

historical:
  enabled: true
  minimum_drawdown: -0.15
  recovery_tolerance: 0.0
  maximum_analogues: 5
  fundamental_minimum_score_coverage: 0.0

scenario:
  enabled: true
  horizons_months: [3, 6, 12, 18, 24]
  target_horizon_months: 12
  minimum_history_points: 2
  minimum_target_models: 1

scoring:
  enabled: true
  fundamental_quality_weight: 0.20
  valuation_weight: 0.20
  temporary_shock_weight: 0.15
  normalization_weight: 0.15
  catalyst_weight: 0.10
  future_growth_weight: 0.10
  risk_weight: 0.10
  minimum_subscore_coverage: 0.25
  minimum_opportunity_coverage: 0.50

backtest:
  enabled: false
  archive_live_runs: true
  strict: true
  start_year: 2018
  end_year: 2025
  holding_months: 12
  minimum_score: 50
  transaction_cost_bps_per_side: 10
  annual_risk_free_rate: 0.0
  minimum_trades: 5

# Optional paid adapter kept disabled by the normal pipeline. It is not required
# for live scans; the free official-source strategy is documented separately.
historical_data:
  provider: sharadar
  api_key_env: SHARADAR_API_KEY
  base_url: https://api.sharadar.com/v1.0/data
  start_year: 2018
  end_year: 2025
  universe: sp500
  required_tables: [tickers, sp500, stocks, fundamentals, daily, actions, events]
  timeout_seconds: 60

# Reserved until a distinct API key is supplied and the critical-analyst phase
# is explicitly activated. Responses are not stored provider-side by default.
ai_analyst:
  enabled: false
  provider: openai
  model: gpt-5.6-terra
  api_key_env: OPENAI_API_KEY
  api: responses
  store: false

screening:
  drawdown_52w_threshold: -0.20
  drawdown_3m_threshold: -0.15
  drawdown_6m_threshold: -0.20
  relative_sector_threshold: -0.10
  minimum_observations: 60
  rsi_period: 14
  annualization_days: 252

export:
  csv: true
  excel: true
  filename_prefix: "stock_opportunity_scan"

alerts:
  enabled: true
  channels: [local]
  minimum_opportunity_score: 50
  minimum_score_coverage: 0.50
  require_pea_focus: true
  send_only_new: true

logging:
  level: "INFO"
